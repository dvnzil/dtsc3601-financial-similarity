<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Financial Ratio Similarity</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  form { display: grid; gap: 0.75rem; }
  label { display: flex; flex-direction: column; font-size: 0.9rem; gap: 0.25rem; }
  input { padding: 0.4rem; font-size: 1rem; }
  button { padding: 0.6rem; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
  #error { color: #b00020; white-space: pre-wrap; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
</style>
</head>
<body>
<h1>Financial Ratio Similarity Finder</h1>
<p>Enter a company's raw balance-sheet / income-statement figures to find the 5 most similar companies.</p>

<form id="form">
  <label>Total current assets
    <input type="number" step="any" min="0" name="Total current assets" required />
  </label>
  <label>Total assets
    <input type="number" step="any" min="0" name="Total assets" required />
  </label>
  <label>Total current liabilities
    <input type="number" step="any" min="0" name="Total current liabilities" required />
  </label>
  <label>Total liabilities
    <input type="number" step="any" min="0" name="Total liabilities" required />
  </label>
  <label>Total debt
    <input type="number" step="any" min="0" name="Total debt" required />
  </label>
  <label>Total shareholders equity
    <input type="number" step="any" min="0" name="Total shareholders equity" required />
  </label>
  <label>Revenue
    <input type="number" step="any" min="0" name="Revenue" required />
  </label>
  <label>Net Income
    <input type="number" step="any" min="0" name="Net Income" required />
  </label>
  <button type="submit">Find similar companies</button>
</form>

<div id="error"></div>
<div id="result"></div>

<script>
  const API_URL = "https://dvnzil--dtsc3601-financial-similarity-fastapi-app.modal.run";

  const form = document.getElementById("form");
  const errorEl = document.getElementById("error");
  const resultEl = document.getElementById("result");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    resultEl.innerHTML = "";

    const data = Object.fromEntries(new FormData(form));
    for (const key in data) data[key] = parseFloat(data[key]);

    try {
      const res = await fetch(`${API_URL}/similar`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      if (!res.ok) {
        const body = await res.json();
        errorEl.textContent = `Error ${res.status}: ${JSON.stringify(body.detail, null, 2)}`;
        return;
      }

      const body = await res.json();
      const rows = body.results
        .map((r) => `<tr><td>${r.ticker}</td><td>${r.distance.toFixed(6)}</td></tr>`)
        .join("");
      resultEl.innerHTML = `
        <table>
          <thead><tr><th>Ticker</th><th>Distance</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch (err) {
      errorEl.textContent = `Request failed: ${err.message}`;
    }
  });
</script>
</body>
</html>
